</head>
<body>

<header class="top">
  <a class="mark" href="index.html">Clara</a>
  <nav aria-label="Primary">
    <a href="about.html">About</a>

  </nav>

<main id="main">
<section class="narrow" style="padding-top:140px;">
  <div class="section-label">Grand Challenges Scholars Program</div>
  <a class="detail-back" href="index.html">&#8592; All competencies</a>
  <div class="detail-head">
    <div class="detail-icon" id="detailIcon" aria-hidden="true"></div>
    <h1 id="detailTitle"></h1>
  </div>
  <ul class="detail-list" id="detailList"></ul>
</section>
</main>

<div class="subpage-footer">
  <a class="link" href="index.html">&#8592; Back to home</a>
</div>

<script>
(function(){
  var key = 'talent';
  var m = window.location.search.match(/[?&]c=([^&]+)/);
  if(m){ key = decodeURIComponent(m[1]); }
  var c = null;
  for(var i=0;i<COMP_DATA.length;i++){ if(COMP_DATA[i].key === key){ c = COMP_DATA[i]; break; } }
  if(!c){ c = COMP_DATA[0]; }

  document.title = c.title + ' · Clara';
  var iconEl = document.getElementById('detailIcon');
  iconEl.innerHTML = ICONS[c.key];
  iconEl.style.background = COLOR_BY_KEY[c.key];
  iconEl.style.color = '#fff';
  document.getElementById('detailTitle').textContent = c.title;
  function linksOf(it){
    if(it.links) return it.links;
    if(it.link) return [{ label:'View', href:it.link }];
    return [];
  }
  function briefLabel(text){
    var words = text.replace(/["“”]/g, '').split(' ').slice(0, 8).join(' ');
    return words + (words.length < text.length ? '…' : '');
  }

  var list = document.getElementById('detailList');
  list.innerHTML = c.items.map(function(it, idx){
    var links = linksOf(it);
    var expandable = !!(it.image || it.expand);
    var slot = expandable
      ? '<span class="d-link">View &#8599;</span>'
      : (links.length ? '<a class="d-link" href="'+links[0].href+'" target="_blank" rel="noopener" aria-label="View: '+briefLabel(it.t)+' (opens in a new tab)">View &#8599;</a>' : '<span class="d-link"></span>');
    return '<li'+(expandable ? ' class="expandable" tabindex="0" role="button" aria-haspopup="dialog" data-idx="'+idx+'"' : '')+'>'+
      '<span class="d">'+it.d+'</span><div><p class="d-title">'+it.title+'</p><p class="d-desc">'+it.t+'</p></div>'+slot+'</li>';
  }).join('');

  Array.prototype.forEach.call(list.querySelectorAll('li.expandable'), function(li){
    var it = c.items[+li.getAttribute('data-idx')];
    var open = function(){
      window.openExpandCard(li, it.abstract
        ? { date:it.d, title:it.title, label:'Abstract', desc:it.abstract, links:linksOf(it) }
        : { date:it.d, title:it.title, desc:it.t, image:it.image, links:linksOf(it), color:COLOR_BY_KEY[c.key], icon:ICONS[c.key] });
    };
    li.addEventListener('click', open);
    li.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } });
  });
})();
</script>

</body>
</html>
