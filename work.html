<body>

  <a class="mark" href="index.html">Clara</a>

  </nav>

<main id="main">
<section style="padding-top:140px;">
  <h1 class="section-label">Research &amp; work</h1>
  <div class="work-grid" id="workGrid"></div>
</section>
</main>

<div class="subpage-footer">
  <a class="link" href="index.html">&#8592; Back to home</a>
</div>

<script>
(function(){
  var grid = document.getElementById('workGrid');

  function linksOf(item){
    if(item.links) return item.links;
    if(item.link) return [{ label:'View source', href:item.link }];
    return [];
  }

  WORK_DATA.forEach(function(item){
    var row = document.createElement('div');
    row.className = 'work-row';
    var links = linksOf(item);
    var expandable = !!(item.image || item.expand);

    var html = '<div class="date">'+item.date+'</div><div><p class="role">'+item.role+'</p><p class="desc">'+item.desc+'</p>';
    if(!expandable && links.length){
      html += '<p class="row-links">'+links.map(function(l){
        return '<a class="row-link" href="'+l.href+'" target="_blank" rel="noopener">'+l.label+' &#8599;<span class="sr-only"> (opens in a new tab)</span></a>';
      }).join('')+'</p>';
    }
    html += '</div>';
    html += expandable ? '<span class="view-link">View &#8599;</span>' : '<span class="view-link"></span>';
    row.innerHTML = html;

    if(expandable){
      row.classList.add('expandable');
      row.tabIndex = 0;
      row.setAttribute('role', 'button');
      row.setAttribute('aria-haspopup', 'dialog');
      var open = function(){
        window.openExpandCard(row, item.abstract
          ? { date:item.date, title:item.role, label:'Abstract', desc:item.abstract, links:links }
          : { date:item.date, title:item.role, desc:item.desc, image:item.image, links:links });
      };
      row.addEventListener('click', open);
      row.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } });
    }

    grid.appendChild(row);
  });
})();
</script>

</body>
</html>
